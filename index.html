<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="full-screen" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#faf7f2">
    <title>Мои маленькие истории</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js" async></script>
    
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/screens.css">
    <link rel="stylesheet" href="css/canvas.css">
    <link rel="stylesheet" href="css/onboarding.css">
    <link rel="stylesheet" href="css/scene.css">
    <link rel="stylesheet" href="css/minigame.css">
    <link rel="stylesheet" href="css/telegram.css">
</head>
<body>
    <div id="app">

        <!-- ЭКРАН 0: ОНБОРДИНГ -->
        <section id="screen-onboarding" class="screen">
            <div class="onboarding-body"></div>
        </section>

        <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
        <section id="screen-menu" class="screen">
            <div class="menu-main">
                <div class="hero-display" id="hero-display">
                    <div id="hero-avatar-stack" class="hero-avatar-stack"></div>
                </div>
                
                <h1 class="hero-name" id="hero-name">Герой</h1>
                
                <button class="btn-stories" id="btn-stories">
                    <span class="btn-stories-icon">📚</span>
                    <span class="btn-stories-text">Истории</span>
                </button>
            </div>
            
            <nav class="bottom-nav">
                <button class="nav-btn" data-nav="character">
                    <span class="nav-icon">👦</span>
                    <span class="nav-label">Герой</span>
                </button>
                <button class="nav-btn" data-nav="inventory">
                    <span class="nav-icon">🎒</span>
                    <span class="nav-label">Вещи</span>
                </button>
                <button class="nav-btn" data-nav="activities">
                    <span class="nav-icon">🎮</span>
                    <span class="nav-label">Игры</span>
                </button>
                <button class="nav-btn" data-nav="progress">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">Успехи</span>
                </button>
                <button class="nav-btn" data-nav="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-label">Настройки</span>
                </button>
            </nav>
        </section>

        <!-- ЭКРАН 2: ПЕРСОНАЖ -->
        <section id="screen-character" class="screen">
            <header class="top-bar">
                <button class="back-btn" data-back>←</button>
                <h2>Мой герой</h2>
            </header>
            <div class="character-body"></div>
        </section>

        <!-- ЭКРАН 3: СПИСОК СКАЗОК -->
        <section id="screen-stories" class="screen">
            <header class="top-bar">
                <button class="back-btn" data-back>←</button>
                <h2>Истории</h2>
            </header>
            <div id="stories-grid" class="stories-grid"></div>
        </section>

        <!-- ЭКРАН 4: СКАЗКА -->
        <section id="screen-story" class="screen">
            <header class="top-bar">
                <button class="back-btn" data-back>←</button>
                <h2 id="story-title">Сказка</h2>
                <span id="story-progress" class="progress-badge">1/5</span>
            </header>
            <div class="story-scene" id="story-scene">
                <div class="scene-background" id="scene-bg"></div>
                <div class="scene-actors" id="scene-actors"></div>
            </div>
            <div class="story-body">
                <p class="story-text" id="story-text"></p>
                <div class="story-task" id="story-task"></div>
                <div class="story-choices" id="story-choices"></div>
            </div>
        </section>

        <!-- ЭКРАН 5: РИСОВАНИЕ ПРЕДМЕТА / РЕДАКТОР ЧАСТИ -->
        <section id="screen-draw" class="screen">
            <header class="top-bar">
                <button class="back-btn" data-back>←</button>
                <h2 id="draw-title">Рисуем</h2>
            </header>
            <div class="draw-body">
                <p class="draw-hint" id="draw-hint"></p>
                <div class="canvas-container">
                    <div class="canvas-layers">
                        <canvas id="draw-canvas" width="600" height="600"></canvas>
                    </div>
                </div>
                <div class="tools-panel">
                    <div class="colors">
                        <button class="color" data-color="#1a1a1a" style="background:#1a1a1a"></button>
                        <button class="color" data-color="#e63946" style="background:#e63946"></button>
                        <button class="color" data-color="#f4a261" style="background:#f4a261"></button>
                        <button class="color" data-color="#2a9d8f" style="background:#2a9d8f"></button>
                        <button class="color" data-color="#457b9d" style="background:#457b9d"></button>
                        <button class="color" data-color="#9d4edd" style="background:#9d4edd"></button>
                        <button class="color" data-color="#ffd60a" style="background:#ffd60a"></button>
                        <button class="color" data-color="#ffffff" style="background:#ffffff;border:1px solid #ccc"></button>
                    </div>
                    <div class="tool-buttons">
                        <button class="tool active" data-tool="brush">🖌️ Кисть</button>
                        <button class="tool" data-tool="eraser">🧽 Ластик</button>
                        <button class="tool" data-tool="clear">🗑️ Очистить</button>
                    </div>
                    <div class="size-slider">
                        <label>Толщина: <input type="range" id="draw-brush-size" min="2" max="40" value="8"></label>
                    </div>
                </div>
                <button class="btn-primary" id="save-drawing">✅ Готово!</button>
            </div>
        </section>

        <!-- ЭКРАН 6: ИНВЕНТАРЬ -->
        <section id="screen-inventory" class="screen">
            <header class="top-bar">
                <button class="back-btn" data-back>←</button>
                <h2>Мои вещи</h2>
            </header>
            <div id="inventory-grid" class="inventory-grid"></div>
        </section>

        <!-- ЭКРАН 7: АКТИВНОСТИ -->
        <section id="screen-activities" class="screen">
            <header class="top-bar">
                <button class="back-btn" data-back>←</button>
                <h2>Мои игры</h2>
            </header>
            <div id="activities-grid" class="activities-grid"></div>
        </section>

        <!-- ЭКРАН 8: ПРОГРЕСС -->
        <section id="screen-progress" class="screen">
            <header class="top-bar">
                <button class="back-btn" data-back>←</button>
                <h2>Мои успехи</h2>
            </header>
            <div id="progress-body" class="progress-body"></div>
        </section>

        <!-- ЭКРАН 9: НАСТРОЙКИ -->
        <section id="screen-settings" class="screen">
            <header class="top-bar">
                <button class="back-btn" data-back>←</button>
                <h2>Настройки</h2>
            </header>
            <div class="settings-body">
                <div class="setting-item">
                    <label class="setting-label">
                        <span>🔊 Звук</span>
                        <input type="checkbox" id="setting-sound" checked>
                    </label>
                </div>
                <div class="setting-item">
                    <label class="setting-label">
                        <span>📳 Вибрация</span>
                        <input type="checkbox" id="setting-vibration" checked>
                    </label>
                </div>
                <div class="setting-item">
                    <button class="setting-btn" id="setting-reset">🔄 Сбросить прогресс</button>
                </div>
                <div class="setting-item">
                    <label class="setting-label" style="flex-direction:column;align-items:flex-start;gap:8px;">
                        <span>💻 Чит-коды</span>
                        <input type="text" id="setting-cheat" class="name-input-small" placeholder="sv_cheats 1" style="width:100%;">
                    </label>
                    <p class="setting-hint">Введи команду для разблокировки всего</p>
                </div>
                <div class="setting-item setting-about">
                    <p><b>Мои маленькие истории</b></p>
                    <p style="font-size:12px;opacity:0.7;">v0.1 — Little Big Planet в мире Paint</p>
                </div>
            </div>
        </section>

        <!-- ЭКРАН 10: МИНИ-ИГРА -->
        <section id="screen-minigame" class="screen">
            <header class="top-bar">
                <h2 id="minigame-title">🎮 Играем!</h2>
                <span id="minigame-progress" class="progress-badge">⭐ 0/5</span>
            </header>
            <div class="minigame-body">
                <p class="minigame-hint" id="minigame-hint">Тапай на экран, чтобы подпрыгнуть!</p>
                <div id="minigame-container"></div>
            </div>
        </section>

        <div id="modal" class="modal">
            <div class="modal-content">
                <h3 id="modal-title"></h3>
                <p id="modal-text"></p>
                <button id="modal-close">Понятно</button>
            </div>
        </div>

        <div id="toast" class="toast"></div>

    </div>

    <!-- Данные -->
    <script src="data/stories/prince_and_dragon.js"></script>
    <script src="data/player/items.js"></script>

    <!-- Ядро -->
    <script src="js/core/state.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/router.js"></script>
    <script src="js/core/telegram.js"></script>
    <script src="js/core/audio.js"></script>
    <script src="js/core/settings.js"></script>

    <!-- Игрок -->
    <script src="js/player/avatar-parts.js"></script>
    <script src="js/player/avatar.js"></script>
    <script src="js/player/character.js"></script>
    <script src="js/player/inventory.js"></script>
    <script src="js/player/progression.js"></script>
    <script src="js/player/activities.js"></script>
    <script src="js/player/progress-screen.js"></script>

    <!-- Рисование -->
    <script src="js/drawing/canvas.js"></script>
    <script src="js/drawing/tools.js"></script>
    <script src="js/drawing/export.js"></script>
    <script src="js/drawing/draw.js"></script>

    <!-- Сказки -->
    <script src="js/story/engine.js"></script>
    <script src="js/story/branches.js"></script>
    <script src="js/story/scenes.js"></script>

    <!-- Сцена -->
    <script src="js/scene/stage.js"></script>
    <script src="js/scene/actors.js"></script>
    <script src="js/scene/animations.js"></script>

    <!-- Мини-игры -->
    <script src="js/minigames/engine.js"></script>
    <script src="js/minigames/gravity.js"></script>
    <script src="js/minigames/angry_birds.js"></script>
    <script src="js/minigames/fighting.js"></script>
    <script src="js/minigames/physics.js"></script>
    <script src="js/minigames/puzzle.js"></script>
    <script src="js/minigames/platformer.js"></script>
    <script src="js/minigames/racing.js"></script>

    <!-- UI -->
    <script src="js/ui/modal.js"></script>
    <script src="js/ui/toast.js"></script>
    <script src="js/ui/buttons.js"></script>
    <script src="js/ui/onboarding.js"></script>
    <script src="js/ui/bottom-nav.js"></script>

    <!-- Точка входа -->
    <script src="js/main.js"></script>
</body>
</html>
